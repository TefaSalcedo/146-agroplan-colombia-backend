services:
  - type: web
    name: agroplan-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    plan: starter
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: agroplan-db
          property: connectionString
      - key: MIGRATION_DATABASE_URL
        fromDatabase:
          name: agroplan-db
          property: connectionString
      - key: OPEN_METEO_BASE_URL
        value: https://api.open-meteo.com
      - key: OPEN_METEO_ARCHIVE_URL
        value: https://archive-api.open-meteo.com
      - key: API_V1_PREFIX
        value: /api/v1
      - key: CORS_ORIGINS
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_MODEL_REPO_ZONING
        sync: false
      - key: HF_MODEL_REPO_YIELD
        sync: false
      - key: HF_MODEL_REVISION
        value: main
      - key: HF_DOWNLOAD_MODE
        value: mvp
      - key: LLM_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODELS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODELS
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: 30
      - key: ADMIN_API_KEY
        sync: false
      - key: CACHE_TTL_STRATEGY
        value: end_of_month_bogota
      - key: ENABLE_MOCK_PREDICTOR
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: TZ
        value: America/Bogota
    disk:
      name: agroplan-models
      mountPath: /app/models
      sizeGB: 5

databases:
  - name: agroplan-db
    plan: free
    databaseName: agroplan
    user: agroplan
