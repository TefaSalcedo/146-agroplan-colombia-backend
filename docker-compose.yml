services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://agroplan:agroplan@db:5432/agroplan
      - MIGRATION_DATABASE_URL=postgresql://agroplan:agroplan@db:5432/agroplan
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com
      - OPEN_METEO_ARCHIVE_URL=https://archive-api.open-meteo.com
      - ML_DATA_PATH=./data
      - ML_MODELS_PATH=./models
      - API_V1_PREFIX=/api/v1
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - ENABLE_CLIMATE_SYNC=${ENABLE_CLIMATE_SYNC:-true}
      - CLIMATE_SYNC_HOUR=${CLIMATE_SYNC_HOUR:-3}
      - CLIMATE_SYNC_MINUTE=${CLIMATE_SYNC_MINUTE:-0}
      - CLIMATE_SYNC_BATCH_SIZE=${CLIMATE_SYNC_BATCH_SIZE:-100}
      - CLIMATE_SYNC_DELAY_SECONDS=${CLIMATE_SYNC_DELAY_SECONDS:-2.0}
      - CLIMATE_SYNC_DAYS_AHEAD=${CLIMATE_SYNC_DAYS_AHEAD:-16}
      - CLIMATE_SYNC_CLEANUP_DAYS=${CLIMATE_SYNC_CLEANUP_DAYS:-180}
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_MODEL_REPO_ZONING=${HF_MODEL_REPO_ZONING:-}
      - HF_MODEL_REPO_YIELD=${HF_MODEL_REPO_YIELD:-}
      - HF_MODEL_REVISION=${HF_MODEL_REVISION:-main}
      - HF_DOWNLOAD_MODE=${HF_DOWNLOAD_MODE:-mvp}
      - LLM_PROVIDER=${LLM_PROVIDER:-openrouter}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODELS=${OPENROUTER_MODELS:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODELS=${GROQ_MODELS:-}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-30}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - CACHE_TTL_STRATEGY=${CACHE_TTL_STRATEGY:-end_of_month_bogota}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=America/Bogota
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - models_data:/app/models
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=agroplan
      - POSTGRES_PASSWORD=agroplan
      - POSTGRES_DB=agroplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroplan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  models_data:
